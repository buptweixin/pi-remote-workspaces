name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Ensure local sshd for integration tests
        run: |
          if [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-server
          fi
          sudo mkdir -p /run/sshd
      - run: npm run check
      - run: npm test
      - run: npm run test:integration
      - run: npm run test:package
