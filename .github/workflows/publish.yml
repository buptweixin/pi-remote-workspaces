name: Publish
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11
      - name: Check tag and registry version
        id: release
        run: node scripts/release-info.mjs
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Verify the exact package archive
        run: npm run test:package -- --output-dir "$RUNNER_TEMP/pi-remote-release"
      - name: Publish with npm Trusted Publishing
        if: steps.release.outputs.publish == 'true'
        run: |
          archives=("$RUNNER_TEMP"/pi-remote-release/*.tgz)
          test "${#archives[@]}" -eq 1
          npm publish "${archives[0]}" --access public
      - name: Verify public npm metadata
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
        run: PACKAGE_ARCHIVE_DIR="$RUNNER_TEMP/pi-remote-release" node scripts/wait-for-package.mjs
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" "$RUNNER_TEMP"/pi-remote-release/*.tgz "$RUNNER_TEMP"/pi-remote-release/*.piplug --verify-tag --title "$RELEASE_TAG" --notes-file CHANGELOG.md
          fi
